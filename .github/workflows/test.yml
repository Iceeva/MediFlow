name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mediflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d mediflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/mediflow_test
      DIRECT_URL: postgresql://test:test@localhost:5432/mediflow_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/mediflow_test
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply schema
        run: |
          if ls prisma/migrations/*/migration.sql >/dev/null 2>&1; then npx prisma migrate deploy; else npx prisma db push --skip-generate; fi
      - name: Unit, component and integration tests
        run: npm test
